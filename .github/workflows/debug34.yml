name: step 34 - Build netfilter traffic marking modules

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-aarch64-linux-gnu make clang lld

    - name: Prepare output directory
      run: mkdir -p out

    - name: Copy official .config
      run: cp .github/configs/.config out/.config

    - name: Kernel olddefconfig
      run: make ARCH=arm64 LLVM=1 O=out olddefconfig

    - name: Kernel modules_prepare
      run: make ARCH=arm64 LLVM=1 O=out modules_prepare

    - name: Build netfilter modules
      run: make ARCH=arm64 LLVM=1 O=out M=net/netfilter modules

    - name: Package DSCP/TOS/MARK/CLASSIFY
      run: |
        mkdir -p out/netfilter_pkg
        cp out/net/netfilter/xt_DSCP.ko out/netfilter_pkg/ || true
        cp out/net/netfilter/xt_TOS.ko out/netfilter_pkg/ || true
        cp out/net/netfilter/xt_MARK.ko out/netfilter_pkg/ || true
        cp out/net/netfilter/xt_CLASSIFY.ko out/netfilter_pkg/ || true
        tar -czf netfilter-modules.tar.gz -C out/netfilter_pkg .

    - name: Upload netfilter artifact
      uses: actions/upload-artifact@v4
      with:
        name: netfilter-modules
        path: netfilter-modules.tar.gz
