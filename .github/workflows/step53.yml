name: step 53 - Build netfilter modules with separate artifacts

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Clone kernel dandelion-q-oss
      run: |
        set -ex
        git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b dandelion-q-oss kernel

    - name: Install dependencies
      run: |
        set -ex
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev \
          libncurses-dev libelf-dev clang lld

    - name: Prepare out directory
      run: |
        set -ex
        mkdir -p kernel/out

    - name: Copy official .config
      run: |
        set -ex
        if [ -f .github/configs/.config ]; then
          cp .github/configs/.config kernel/out/.config
        elif [ -f .config ]; then
          cp .config kernel/out/.config
        else
          echo "No se encontró ningún .config" && exit 1
        fi

    - name: Run olddefconfig
      run: |
        set -ex
        make ARCH=arm64 LLVM=1 O=kernel/out -C kernel olddefconfig

    - name: Prepare modules
      run: |
        set -ex
        make ARCH=arm64 LLVM=1 O=kernel/out -C kernel modules_prepare

    - name: Build netfilter modules
      run: |
        set -ex
        make ARCH=arm64 LLVM=1 O=kernel/out -C kernel M=net/netfilter modules

    - name: Generate SHA256 checksums
      run: |
        set -ex
        mkdir -p kernel/out/netfilter_pkg
        for mod in xt_DSCP.ko xt_TOS.ko xt_MARK.ko xt_CLASSIFY.ko; do
          if [ -f kernel/out/net/netfilter/$mod ]; then
            cp kernel/out/net/netfilter/$mod kernel/out/netfilter_pkg/
            sha256sum kernel/out/netfilter_pkg/$mod > kernel/out/netfilter_pkg/$mod.sha256
          fi
        done

    - name: Upload DSCP module
      uses: actions/upload-artifact@v4
      with:
        name: xt_DSCP.ko
        path: |
          kernel/out/netfilter_pkg/xt_DSCP.ko
          kernel/out/netfilter_pkg/xt_DSCP.ko.sha256

    - name: Upload TOS module
      uses: actions/upload-artifact@v4
      with:
        name: xt_TOS.ko
        path: |
          kernel/out/netfilter_pkg/xt_TOS.ko
          kernel/out/netfilter_pkg/xt_TOS.ko.sha256

    - name: Upload MARK module
      uses: actions/upload-artifact@v4
      with:
        name: xt_MARK.ko
        path: |
          kernel/out/netfilter_pkg/xt_MARK.ko
          kernel/out/netfilter_pkg/xt_MARK.ko.sha256

    - name: Upload CLASSIFY module
      uses: actions/upload-artifact@v4
      with:
        name: xt_CLASSIFY.ko
        path: |
          kernel/out/netfilter_pkg/xt_CLASSIFY.ko
          kernel/out/netfilter_pkg/xt_CLASSIFY.ko.sha256
