name: step 31 - Build all kernel modules

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-aarch64-linux-gnu make clang lld

    - name: Prepare output directory
      run: mkdir -p out

    - name: Copy official .config
      run: cp .github/configs/.config out/.config

    - name: Kernel olddefconfig
      run: make ARCH=arm64 LLVM=1 O=out olddefconfig

    - name: Kernel modules_prepare
      run: make ARCH=arm64 LLVM=1 O=out modules_prepare

    - name: Build all modules
      run: make ARCH=arm64 LLVM=1 O=out modules

    - name: Package modules
      run: tar -czf kernel-modules.tar.gz -C out .

    - name: Upload all modules artifact
      uses: actions/upload-artifact@v4
