name: Deep_sp10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Clone kernel custom (plmzaq2112, 4.19.275)
      run: |
        set -ex
        git clone --depth=1 https://github.com/plmzaq2112/android_kernel_mt6765.git -b v1.0 kernel

    - name: Install dependencies
      run: |
        set -ex
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev \
          libncurses-dev libelf-dev clang lld

    - name: Prepare out directory
      run: |
        set -ex
        mkdir -p kernel/out

    - name: Copy official .config
      run: |
        set -ex
        if [ -f .github/config/.config ]; then
          echo "Usando .github/config/.config"
          cp .github/config/.config kernel/out/.config
        elif [ -f .github/configs/.config ]; then
          echo "Usando .github/configs/.config"
          cp .github/configs/.config kernel/out/.config
        elif [ -f .config ]; then
          echo "Usando .config de la raíz"
          cp .config kernel/out/.config
        else
          echo "ERROR: No se encontró ningún .config en las rutas esperadas"
          exit 1
        fi

    - name: Enable xt_DSCP in .config
      run: |
        set -ex
        if grep -q "^# CONFIG_NETFILTER_XT_TARGET_DSCP is not set" kernel/out/.config; then
          sed -i 's/^# CONFIG_NETFILTER_XT_TARGET_DSCP is not set/CONFIG_NETFILTER_XT_TARGET_DSCP=m/' kernel/out/.config
        elif grep -q "^CONFIG_NETFILTER_XT_TARGET_DSCP=" kernel/out/.config; then
          sed -i 's/^CONFIG_NETFILTER_XT_TARGET_DSCP=.*/CONFIG_NETFILTER_XT_TARGET_DSCP=m/' kernel/out/.config
        else
          echo "CONFIG_NETFILTER_XT_TARGET_DSCP=m" >> kernel/out/.config
        fi
        echo "=== Verificación ==="
        grep "CONFIG_NETFILTER_XT_TARGET_DSCP" kernel/out/.config

    - name: Run olddefconfig
      run: |
        set -ex
        make ARCH=arm64 LLVM=1 O=kernel/out -C kernel olddefconfig -j2
        echo "=== Verificación post-olddefconfig ==="
        grep "CONFIG_NETFILTER_XT_TARGET_DSCP" kernel/out/.config || echo "ADVERTENCIA: la opción desapareció tras olddefconfig"

    - name: Fix dtc yylloc for GCC 10+
      run: |
        set -ex
        if [ -f kernel/scripts/dtc/dtc-lexer.l ]; then
          sed -i '/^YYLTYPE yylloc;$/d' kernel/scripts/dtc/dtc-lexer.l
          echo "Parcheado dtc-lexer.l"
        else
          echo "dtc-lexer.l no existe, se omite"
        fi
        if [ -f kernel/scripts/dtc/dtc-lexer.lex.c_shipped ]; then
          sed -i '/^YYLTYPE yylloc;$/d' kernel/scripts/dtc/dtc-lexer.lex.c_shipped
          echo "Parcheado dtc-lexer.lex.c_shipped"
        else
          echo "dtc-lexer.lex.c_shipped no existe, se omite"
        fi

    - name: Fix vdso_prepare for external modules (arm64)
      run: |
        set -ex
        python3 .github/scripts/fix_vdso.py

    - name: Prepare kernel scripts
      run: |
        set -ex
        make ARCH=arm64 LLVM=1 O=kernel/out -C kernel scripts -j2

    - name: Prepare modules
      run: |
        set -ex
        make ARCH=arm64 LLVM=1 O=kernel/out -C kernel modules_prepare -j2

    - name: Build xt_DSCP only
      run: |
        set -ex
        make ARCH=arm64 LLVM=1 O=kernel/out -C kernel M=net/netfilter xt_DSCP.ko \
          KBUILD_MODPOST_WARN=1 modules -j2 || true
        echo ""
        echo "=== Verificando que xt_DSCP.ko se generó ==="
        find . -iname "xt_DSCP.ko" -type f 2>/dev/null || echo "No se encontró xt_DSCP.ko"

    - name: Locate and copy xt_DSCP.ko
      run: |
        set -ex
        echo "=== Buscando xt_DSCP.ko en todo el repo ==="
        KO=$(find . -iname "xt_DSCP.ko" -type f 2>/dev/null | head -1)

        if [ -z "$KO" ]; then
          echo "ERROR: xt_DSCP.ko no se encontró en ninguna parte del repo"
          find . -iname "*.ko" -type f 2>/dev/null | head -50 || true
          exit 1
        fi

        echo "Encontrado: $KO"
        ls -lh "$KO"
        cp "$KO" ./xt_DSCP.ko
        ls -lh ./xt_DSCP.ko
        sha256sum ./xt_DSCP.ko > ./xt_DSCP.ko.sha256
        cat ./xt_DSCP.ko.sha256

    - name: Upload xt_DSCP.ko
      uses: actions/upload-artifact@v4
      with:
        name: xt_DSCP-ko
        path: |
          xt_DSCP.ko
          xt_DSCP.ko.sha256
        if-no-files-found: error
