name: Debug 18 xt_DSCP workflow

on:
  workflow_dispatch:

jobs:
  debug18:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Clone kernel dandelion-q-oss
      run: |
        set -x
        git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b dandelion-q-oss kernel

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev \
          libncurses-dev libelf-dev

    - name: Generate defconfig
      run: |
        set -x
        mkdir -p kernel/out
        make ARCH=arm64 O=kernel/out -C kernel dandelion_defconfig

    - name: Prepare modules
      run: |
        set -x
        make ARCH=arm64 O=kernel/out -C kernel modules_prepare

    - name: Build xt_DSCP.ko
      run: |
        set -x
        make ARCH=arm64 O=kernel/out -C kernel M=net/netfilter modules

    - name: Upload artifact
      uses: actions/upload-artifact@v4.3.0
      with:
        name: xt_DSCP-dandelion
        path: kernel/out/net/netfilter/xt_DSCP.ko
